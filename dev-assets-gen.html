<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Echolume asset generator (dev only)</title></head>
<body style="background:#0a1020;color:#cde">
<p id="log">generating…</p>
<script>
// Draws the app icon + splash in the game's exact visual language and POSTs
// them to the dev server. Not part of the shipped game.

function drawGlow(g, x, y, r, color, coreColor, alpha) {
  const grad = g.createRadialGradient(x, y, 0, x, y, r);
  grad.addColorStop(0, coreColor);
  grad.addColorStop(0.25, color);
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  g.save();
  g.globalAlpha = alpha;
  g.globalCompositeOperation = 'lighter';
  g.fillStyle = grad;
  g.fillRect(x - r, y - r, r * 2, r * 2);
  g.restore();
}

function ring(g, x, y, r, w, color, alpha) {
  g.save();
  g.globalCompositeOperation = 'lighter';
  g.strokeStyle = color;
  g.globalAlpha = alpha * 0.45;
  g.lineWidth = w * 3;
  g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.stroke();
  g.globalAlpha = alpha;
  g.lineWidth = w;
  g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.stroke();
  g.restore();
}

function bg(g, s) {
  const grad = g.createLinearGradient(0, 0, 0, s);
  grad.addColorStop(0, '#061021');
  grad.addColorStop(0.55, '#04101f');
  grad.addColorStop(1, '#02060f');
  g.fillStyle = grad;
  g.fillRect(0, 0, s, s);
  // vignette
  const vg = g.createRadialGradient(s / 2, s / 2, s * 0.3, s / 2, s / 2, s * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.5)');
  g.fillStyle = vg;
  g.fillRect(0, 0, s, s);
}

function motes(g, s, seedPts) {
  for (const [fx, fy, r, a] of seedPts) {
    drawGlow(g, fx * s, fy * s, r * s, '#ffc45e', '#fff2d0', a);
  }
}

function caveHint(g, s) {
  // dim revealed-wall arcs in the corners, like a ping just passed
  g.save();
  g.globalCompositeOperation = 'lighter';
  g.strokeStyle = '#35e0ff';
  g.lineCap = 'round';
  const arcs = [
    [0.06 * s, 1.06 * s, 0.42 * s, -0.62, -0.08, 0.10],
    [1.02 * s, -0.02 * s, 0.44 * s, 2.6, 3.4, 0.08],
    [-0.04 * s, 0.0 * s, 0.36 * s, 0.2, 1.1, 0.07],
  ];
  for (const [x, y, r, a0, a1, alpha] of arcs) {
    g.globalAlpha = alpha * 0.5;
    g.lineWidth = 0.030 * s;
    g.beginPath(); g.arc(x, y, r, a0, a1); g.stroke();
    g.globalAlpha = alpha * 1.6;
    g.lineWidth = 0.008 * s;
    g.beginPath(); g.arc(x, y, r, a0, a1); g.stroke();
  }
  g.restore();
}

function drawIcon(s, opts = {}) {
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  bg(g, s);
  caveHint(g, s);
  const cx = 0.5 * s, cy = 0.46 * s;
  // safe-zone aware: maskable keeps everything within central 80%
  const scale = opts.maskable ? 0.72 : 1;
  ring(g, cx, cy, 0.335 * s * scale, 0.012 * s, '#2bbfe0', 0.5);
  ring(g, cx, cy, 0.235 * s * scale, 0.014 * s, '#4fd9f2', 0.75);
  ring(g, cx, cy, 0.140 * s * scale, 0.016 * s, '#7ef0ff', 0.95);
  drawGlow(g, cx, cy, 0.30 * s * scale, '#2f9fc0', '#7ef0ff', 0.5);
  drawGlow(g, cx, cy, 0.10 * s * scale, '#7ef0ff', '#ffffff', 1);
  g.save();
  g.globalCompositeOperation = 'lighter';
  g.fillStyle = '#ffffff';
  g.beginPath(); g.arc(cx, cy, 0.030 * s * scale, 0, Math.PI * 2); g.fill();
  g.restore();
  motes(g, s, [
    [0.20, 0.76, 0.020, 0.8], [0.79, 0.70, 0.014, 0.65],
    [0.70, 0.22, 0.011, 0.5], [0.28, 0.28, 0.009, 0.45],
    [0.62, 0.84, 0.012, 0.55],
  ]);
  return c;
}

function drawSplash(s) {
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  bg(g, s);
  const cx = 0.5 * s, cy = 0.46 * s;
  ring(g, cx, cy, 0.115 * s, 0.0045 * s, '#2bbfe0', 0.4);
  ring(g, cx, cy, 0.080 * s, 0.005 * s, '#4fd9f2', 0.6);
  ring(g, cx, cy, 0.048 * s, 0.0055 * s, '#7ef0ff', 0.85);
  drawGlow(g, cx, cy, 0.10 * s, '#2f9fc0', '#7ef0ff', 0.5);
  drawGlow(g, cx, cy, 0.034 * s, '#7ef0ff', '#ffffff', 1);
  motes(g, s, [
    [0.42, 0.60, 0.006, 0.7], [0.58, 0.56, 0.005, 0.55], [0.47, 0.34, 0.004, 0.5],
  ]);
  // wordmark
  g.save();
  g.fillStyle = '#eafcff';
  g.shadowColor = 'rgba(126,240,255,0.6)';
  g.shadowBlur = 0.012 * s;
  g.font = `200 ${0.030 * s}px -apple-system, "Segoe UI", Roboto, sans-serif`;
  g.textAlign = 'center';
  const word = 'ECHOLUME';
  const ls = 0.016 * s; // letterspacing
  let total = 0;
  const widths = [...word].map((ch) => { const w = g.measureText(ch).width; total += w; return w; });
  total += ls * (word.length - 1);
  let x = cx - total / 2;
  for (let i = 0; i < word.length; i++) {
    g.textAlign = 'left';
    g.fillText(word[i], x, 0.60 * s);
    x += widths[i] + ls;
  }
  g.restore();
  return c;
}

async function post(name, canvas) {
  const r = await fetch('/__dev/save', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, dataUrl: canvas.toDataURL('image/png') }),
  });
  const j = await r.json();
  log.textContent += `\n${name}: ${j.ok ? j.bytes + ' bytes' : j.error}`;
  return j;
}

function drawFeature(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, w, h);
  grad.addColorStop(0, '#02060f');
  grad.addColorStop(0.5, '#04101f');
  grad.addColorStop(1, '#061021');
  g.fillStyle = grad;
  g.fillRect(0, 0, w, h);
  caveHint(g, h * 1.6);
  const cx = w * 0.26, cy = h * 0.5;
  ring(g, cx, cy, h * 0.34, h * 0.010, '#2bbfe0', 0.45);
  ring(g, cx, cy, h * 0.24, h * 0.011, '#4fd9f2', 0.7);
  ring(g, cx, cy, h * 0.145, h * 0.012, '#7ef0ff', 0.9);
  drawGlow(g, cx, cy, h * 0.30, '#2f9fc0', '#7ef0ff', 0.5);
  drawGlow(g, cx, cy, h * 0.10, '#7ef0ff', '#ffffff', 1);
  motes(g, w, [
    [0.13, 0.24 * h / w, 0.010, 0.7], [0.36, 0.72 * h / w, 0.008, 0.6],
    [0.52, 0.30 * h / w, 0.007, 0.5], [0.90, 0.70 * h / w, 0.009, 0.55],
  ]);
  // wordmark + tagline right of center
  g.save();
  g.fillStyle = '#eafcff';
  g.shadowColor = 'rgba(126,240,255,0.6)';
  g.shadowBlur = h * 0.03;
  g.font = `200 ${h * 0.155}px -apple-system, "Segoe UI", Roboto, sans-serif`;
  const word = 'ECHOLUME';
  const ls = h * 0.055;
  let total = 0;
  const widths = [...word].map((ch) => { const m = g.measureText(ch).width; total += m; return m; });
  total += ls * (word.length - 1);
  let x = w * 0.60 - total / 2;
  for (let i = 0; i < word.length; i++) {
    g.fillText(word[i], x, h * 0.47);
    x += widths[i] + ls;
  }
  g.shadowBlur = h * 0.012;
  g.fillStyle = '#7f97b8';
  g.font = `300 ${h * 0.052}px -apple-system, "Segoe UI", Roboto, sans-serif`;
  const tag = 'M O V E   B Y   S O U N D   ·   S E E   B Y   L I G H T';
  const tw = g.measureText(tag).width;
  g.fillText(tag, w * 0.60 - tw / 2, h * 0.62);
  g.restore();
  return c;
}

// Game Center achievement art: one 1024px tile per abyss milestone.
// Game Center crops these to a circle, so everything meaningful stays
// within ~0.42s of centre. The set reads as one descent: background water
// darkens through the four chapter moods, a gold arc fills one milestone
// segment per tile, and the deepest tiers go warm-dark gold.
const ACH_MILESTONES = [
  1000, 2000, 3000, 4000, 5000,
  10000, 20000, 30000, 40000, 50000,
  60000, 70000, 80000, 90000, 100000,
];

const ACH_PALETTES = [ // shallows → trench → hush → warm dark
  ['#0a1c33', '#061021', '#02060f'],
  ['#06122b', '#040d1c', '#010409'],
  ['#0b0e24', '#070a18', '#020208'],
  ['#1a0d05', '#0d0602', '#030100'],
];

function lerpHex(a, b, t) {
  const ch = (c, i) => parseInt(c.slice(i, i + 2), 16);
  return '#' + [1, 3, 5].map((i) =>
    Math.round(ch(a, i) + (ch(b, i) - ch(a, i)) * t).toString(16).padStart(2, '0')
  ).join('');
}

function achPalette(t) {
  const seg = Math.min(2.9999, t * 3), k = Math.floor(seg), f = seg - k;
  return ACH_PALETTES[k].map((c, i) => lerpHex(c, ACH_PALETTES[k + 1][i], f));
}

function drawAchievement(s, m, i, n) {
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  const t = i / (n - 1);
  const warm = t > 0.72; // deepest tiers wear gold, like a fully lit depth
  const [c0, c1, c2] = achPalette(t);
  const grad = g.createLinearGradient(0, 0, 0, s);
  grad.addColorStop(0, c0);
  grad.addColorStop(0.55, c1);
  grad.addColorStop(1, c2);
  g.fillStyle = grad;
  g.fillRect(0, 0, s, s);
  const vg = g.createRadialGradient(s / 2, s / 2, s * 0.28, s / 2, s / 2, s * 0.62);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.55)');
  g.fillStyle = vg;
  g.fillRect(0, 0, s, s);

  // milestone progress: dim track, gold arc to (i+1)/n, bright end dot
  const cx = 0.5 * s, rT = 0.40 * s;
  g.save();
  g.strokeStyle = warm ? '#3a2a18' : '#22354f';
  g.globalAlpha = 0.6;
  g.lineWidth = 0.010 * s;
  g.beginPath(); g.arc(cx, 0.5 * s, rT, 0, Math.PI * 2); g.stroke();
  g.restore();
  const a0 = -Math.PI / 2, a1 = a0 + Math.PI * 2 * ((i + 1) / n);
  g.save();
  g.globalCompositeOperation = 'lighter';
  g.strokeStyle = '#ffc45e';
  g.lineCap = 'round';
  g.globalAlpha = 0.3;
  g.lineWidth = 0.030 * s;
  g.beginPath(); g.arc(cx, 0.5 * s, rT, a0, a1); g.stroke();
  g.globalAlpha = 0.9;
  g.lineWidth = 0.011 * s;
  g.beginPath(); g.arc(cx, 0.5 * s, rT, a0, a1); g.stroke();
  g.restore();
  drawGlow(g, cx + Math.cos(a1) * rT, 0.5 * s + Math.sin(a1) * rT, 0.04 * s, '#ffc45e', '#fff2d0', 0.9);

  // the lume, cyan in blue water, gold in the warm dark
  const cy = 0.46 * s;
  const cols = warm ? ['#c98f2f', '#ffc45e', '#ffe9b0'] : ['#2bbfe0', '#4fd9f2', '#7ef0ff'];
  ring(g, cx, cy, 0.235 * s, 0.011 * s, cols[0], 0.5);
  ring(g, cx, cy, 0.160 * s, 0.013 * s, cols[1], 0.75);
  ring(g, cx, cy, 0.095 * s, 0.015 * s, cols[2], 0.95);
  drawGlow(g, cx, cy, 0.21 * s, cols[0], cols[2], 0.5);
  drawGlow(g, cx, cy, 0.07 * s, cols[2], '#ffffff', 1);
  g.save();
  g.globalCompositeOperation = 'lighter';
  g.fillStyle = '#ffffff';
  g.beginPath(); g.arc(cx, cy, 0.020 * s, 0, Math.PI * 2); g.fill();
  g.restore();

  // one mote per milestone reached, spiralling around the lume
  const pts = [];
  for (let k = 0; k <= i; k++) {
    const ang = -Math.PI / 2 + k * 2.399963;
    const rr = 0.26 + 0.05 * (k % 3);
    pts.push([0.5 + Math.cos(ang) * rr, 0.46 + Math.sin(ang) * rr * 0.72, 0.008, 0.5]);
  }
  motes(g, s, pts);

  // depth label
  g.save();
  g.fillStyle = warm ? '#ffe9c4' : '#dff2fa';
  g.shadowColor = warm ? 'rgba(255,196,94,0.55)' : 'rgba(126,240,255,0.55)';
  g.shadowBlur = 0.014 * s;
  g.font = `300 ${0.062 * s}px -apple-system, "Segoe UI", Roboto, sans-serif`;
  g.textAlign = 'center';
  g.fillText(`${m.toLocaleString('en-US')} m`, cx, 0.795 * s);
  g.restore();
  return c;
}

// 5×3 contact sheet, each tile circle-cropped the way Game Center shows it.
function drawAchievementSheet(tiles) {
  const cell = 300, pad = 20;
  const c = document.createElement('canvas');
  c.width = 5 * cell + 6 * pad;
  c.height = 3 * cell + 4 * pad;
  const g = c.getContext('2d');
  g.fillStyle = '#0a1020';
  g.fillRect(0, 0, c.width, c.height);
  tiles.forEach((tile, i) => {
    const x = pad + (i % 5) * (cell + pad), y = pad + Math.floor(i / 5) * (cell + pad);
    g.save();
    g.beginPath(); g.arc(x + cell / 2, y + cell / 2, cell / 2, 0, Math.PI * 2); g.clip();
    g.drawImage(tile, x, y, cell, cell);
    g.restore();
  });
  return c;
}

const log = document.getElementById('log');
window.runFeature = async () => (await post('feature-graphic.png', drawFeature(1024, 500))).ok;
window.runAchievements = async () => {
  const out = [], tiles = [];
  for (let i = 0; i < ACH_MILESTONES.length; i++) {
    const m = ACH_MILESTONES[i];
    const tile = drawAchievement(1024, m, i, ACH_MILESTONES.length);
    tiles.push(tile);
    out.push(await post(`achievements/abyss_${m}.png`, tile));
  }
  out.push(await post('achievements/contact-sheet.png', drawAchievementSheet(tiles)));
  log.textContent += '\nACHIEVEMENTS DONE';
  return out.every((o) => o.ok);
};
window.run = async () => {
  const out = [];
  out.push(await post('icon.png', drawIcon(1024)));
  out.push(await post('icon-maskable.png', drawIcon(1024, { maskable: true })));
  out.push(await post('splash.png', drawSplash(2732)));
  out.push(await post('splash-dark.png', drawSplash(2732)));
  // PWA/web sizes
  for (const s of [180, 192, 512]) {
    const c = document.createElement('canvas');
    c.width = c.height = s;
    c.getContext('2d').drawImage(drawIcon(1024), 0, 0, s, s);
    out.push(await post(`pwa/icon-${s}.png`, c));
  }
  const m = document.createElement('canvas');
  m.width = m.height = 512;
  m.getContext('2d').drawImage(drawIcon(1024, { maskable: true }), 0, 0, 512, 512);
  out.push(await post('pwa/icon-512-maskable.png', m));
  log.textContent += '\nDONE';
  return out.every((o) => o.ok);
};
</script>
</body>
</html>
